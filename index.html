<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastPay Rooms - Gestão de Salas</title>
  <meta name="description" content="Sistema de agendamento e gestão de salas de reunião FastPay">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="icon" type="image/png" sizes="37x35" href="assets/fastpay-favicon.png">
  <link rel="apple-touch-icon" href="assets/fastpay-favicon.png">
</head>
<body>
<div id="login-root"></div>
<div id="app" class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="brand-logo" src="assets/fastpay-logo-premium.png" alt="FastPay">
      <span class="brand-product">Rooms</span>
    </div>
    <nav id="main-nav" class="nav">
      <button class="nav-item active" data-view="dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5M9 21v-6h6v6"/></svg></span> Dashboard</button>
      <button class="nav-item" data-view="rooms"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h4M15 12h2M7 16h10"/></svg></span> Salas</button>
      <button class="nav-item" data-view="calendar"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M7 14h3M14 14h3M7 18h6"/></svg></span> Agenda</button>
      <button class="nav-item" data-view="my-reservations"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></span> Minhas reservas</button>
      <div class="nav-section">ADMINISTRAÇÃO</div>
      <button class="nav-item admin-only" data-view="admin-reservations"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14"/><circle cx="8" cy="6" r="1.2"/><circle cx="16" cy="12" r="1.2"/><circle cx="10" cy="18" r="1.2"/></svg></span> Reservas</button>
      <button class="nav-item admin-only" data-view="admin-rooms"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span> Gestão de salas</button>
      <button class="nav-item admin-only" data-view="audit"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 4v2M20 12h-2M12 20v-2M4 12h2"/></svg></span> Auditoria</button>
      <button class="nav-item admin-only" data-view="users"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></span> Usuários e acesso <span class="nav-badge" id="pending-users-badge" hidden></span></button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" id="logout-btn"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"/><path d="M14 8l4 4-4 4M9 12h9"/></svg></span> Sair</button>
      <div class="role-pill" id="role-pill">Colaborador</div>
    </div>
  </aside>
  <div class="mobile-overlay" id="mobile-overlay" aria-hidden="true"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="mobile-menu" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div class="breadcrumb"><span>FastPay</span><b>/</b><strong id="page-title">Dashboard</strong></div>
      <div class="top-actions">
        <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Alternar tema" title="Alternar para tema claro"><svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg><svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5 8.5 8.5 0 1 0 20.5 14.6Z"></path></svg></button><button class="icon-btn notification-btn" id="notification-btn" aria-label="Notificações" title="Notificações"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg><i id="notification-dot"></i></button>
        <div class="user-chip">
          <div class="avatar">HS</div>
          <div class="user-info"><strong id="header-user-name">Usuário</strong><span id="header-role">Colaborador</span></div>
        </div>
      </div>
    </header>
    <section class="content" id="view-root"></section>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/users.js"></script>
<script src="js/auth.js"></script>
<script src="js/rooms.js"></script>
<script src="js/reservations.js"></script>
<script src="js/notifications.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
